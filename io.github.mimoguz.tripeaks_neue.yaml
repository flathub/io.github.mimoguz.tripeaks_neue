# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/master/data/flatpak-manifest.schema.json
app-id: io.github.mimoguz.tripeaks_neue
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: tripeaks_neue
separate-locales: false
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
modules:
  - name: ogg
    buildsystem: cmake-ninja
    config-opts:
    - -DBUILD_TESTING=off
    - -DINSTALL_DOCS=off
    - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://ftp.osuosl.org/pub/xiph/releases/ogg/libogg-1.3.6.tar.gz
        sha256: 83e6704730683d004d20e21b8f7f55dcb3383cdf84c0daedf30bde175f774638
      
  - name: vorbis
    buildsystem: cmake-ninja
    config-opts:
    - -DBUILD_TESTING=off
    - -DINSTALL_DOCS=off
    - -DCMAKE_BUILD_TYPE=Release
    - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://ftp.osuosl.org/pub/xiph/releases/vorbis/libvorbis-1.3.7.tar.gz
        sha256: 0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab

  - name: flac
    buildsystem: autotools
    sources:
      - type: archive
        url: https://ftp.osuosl.org/pub/xiph/releases/flac/flac-1.2.0.tar.gz
        sha256: e0f8525025addf40e9a4fab88bbb0d34b3d5835676600c6be83a20a8dfbb5e4e

  - name: tripeaks_neue
    buildsystem: simple
    build-commands:
      - cp -r tripeaks_neue /app/
      - chmod +x /app/tripeaks_neue/tripeaks_neue
      - mkdir -p /app/bin
      - ln -s /app/tripeaks_neue/tripeaks_neue /app/bin/tripeaks_neue
      - desktop-file-edit git_repo/linux/flatpak/io.github.mimoguz.tripeaks_neue.desktop
        --set-icon=${FLATPAK_ID}
      - install -Dm644 -t "${FLATPAK_DEST}/share/applications/" git_repo/linux/flatpak/io.github.mimoguz.tripeaks_neue.desktop
      - install -Dm644 git_repo/linux/flatpak/icon.svg "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg"
      - install -Dm644 git_repo/linux/flatpak/io.github.mimoguz.tripeaks_neue.metainfo.xml
        /app/share/appdata/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: archive
        only-arches: [x86_64]
        dest: tripeaks_neue
        url: https://github.com/mimoguz/tripeaks_neue/releases/download/0.9.5-pre/tripeaksneue-linux-x86_64.tar.gz
        sha256: aab8cf6c67f6bca092c6f9048eb7c9203d41d50d897bd108a2491d166e3ed4cb
        x-checker-data:
          type: json
          url: https://api.github.com/repos/mimoguz/tripeaks_neue/releases/latest
          tag-query: .tag_name
          timestamp-query: .published_at
          version-query: $tag | sub("^[vV]"; "")
          url-query: '"https://github.com/mimoguz/tripeaks_neue/releases/download/\($tag)/tripeaksneue-linux-x86_64.tar.gz"'
      - type: archive
        only-arches: [aarch64]
        dest: tripeaks_neue
        url: https://github.com/mimoguz/tripeaks_neue/releases/download/0.9.5-pre/tripeaksneue-linux-aarch64.tar.gz
        sha256: e7a58ac4f1ab93d86b6572cd9795d72e397b9dd84528dd35af6dcbe3e6f75c74
        x-checker-data:
          type: json
          url: https://api.github.com/repos/mimoguz/tripeaks_neue/releases/latest
          tag-query: .tag_name
          timestamp-query: .published_at
          version-query: $tag | sub("^[vV]"; "")
          url-query: '"https://github.com/mimoguz/tripeaks_neue/releases/download/\($tag)/tripeaksneue-linux-aarch64.tar.gz"'
      - type: git
        dest: git_repo
        url: https://github.com/mimoguz/tripeaks_neue
        tag: 0.9.5-pre
        commit: fc282a296cb023a145150ceccc096aed9118b490
        x-checker-data:
          type: git
          tag-pattern": ^v([0-9.]+)$
