# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/master/data/flatpak-manifest.schema.json
app-id: io.github.mimoguz.tripeaks_neue
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: tripeaks_neue
rename-icon: icon
separate-locales: false
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio

modules:

  - name: flac
    buildsystem: cmake
    config-opts:
      - -DBUILD_CXXLIBS=off
      - -DBUILD_DOCS=off
      - -DBUILD_EXAMPLES=off
      - -DBUILD_PROGRAMS=off
      - -DBUILD_SHARED_LIBS=on
      - -DBUILD_TESTING=off
      - -DINSTALL_MANPAGES=off
    sources:
      - type: archive
        url: https://github.com/xiph/flac/releases/download/1.4.3/flac-1.4.3.tar.xz
        sha256: 6c58e69cd22348f441b861092b825e591d0b822e106de6eb0ee4d05d27205b70

  - name: tripeaks_neue
    buildsystem: simple
    build-commands:
      - cp -r tripeaks_neue /app/
      - chmod +x /app/tripeaks_neue/tripeaks_neue
      - mkdir -p /app/bin
      - ln -s /app/tripeaks_neue/tripeaks_neue /app/bin/tripeaks_neue
      - install -Dm644 git_repo/linux/flatpak/${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 git_repo/linux/flatpak/icon.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/
      - install -Dm644 git_repo/linux/flatpak/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: archive
        only-arches: [x86_64]
        dest: tripeaks_neue
        url: https://github.com/mimoguz/tripeaks_neue/releases/download/v0.9.5/tripeaksneue-linux-x86_64.tar.gz
        sha256: 7f817b79a480fec3b3a3175d39e1b264d7a0b2227e6bcfa4ea9ee67915a172ad
      - type: archive
        only-arches: [aarch64]
        dest: tripeaks_neue
        url: https://github.com/mimoguz/tripeaks_neue/releases/download/v0.9.5/tripeaksneue-linux-aarch64.tar.gz
        sha256: c3a0eced1dfa98f8de6ca0549552dd3ae792df2af09f66a61a42cd454b27f60d
      - type: git
        dest: git_repo
        url: https://github.com/mimoguz/tripeaks_neue
        tag: v0.9.5
        commit: 7d5d135071a290f053d0d9f0994c596c314e0a38
